
<!DOCTYPE html>

<body class="home-page">

  <header class="site-header">

      <a class="brand" href="index.html" aria-label="Garagebedrijf Oude Booyink - Home">
        <img src="logo.png" alt="Garagebedrijf Oude Booyink" class="logo">
      </a>

      <div class="menu-wrap">
        <button class="menu-toggle" id="menuToggle"
                type="button"
                aria-label="Menu openen"

          <span class="menu-label">MENU</span>

            <span></span>

            <span></span>

        <nav class="menu-panel" id="site-menu"

  <main>

        </button>

        <button class="hero-thumb" type="button"
                data-image="renault captur 2019 rood - 2026.webp"
                aria-label="Bekijk Renault Captur"
                aria-pressed="false">

        </button>

        <button class="hero-thumb" type="button"
                data-image="ford kuga blauwgrijs 2022 - 2026.webp"
